<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c2412">
<title>LIANE : test d'intégration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#1c2412; overflow:hidden; }
  body { touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
         font-family:'Jost', system-ui, sans-serif; font-weight:300; color:#f3f1e4; }
  /* Le monde filmé : deux lecteurs superposés pour boucler en fondu. */
  video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#1c2412; }
  #filmB { opacity:0; }
  /* Un très léger flou : le premier plan prend le grain du film au lieu d'être plus net que lui. */
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; filter:blur(.35px) saturate(.94); }
  #note { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 3.2vh); text-align:center; font-size:min(3.6vw, 1.8vh);
          letter-spacing:.28em; text-transform:uppercase; text-shadow:0 1px 8px rgba(0,0,0,.7); opacity:.85; pointer-events:none; transition:opacity 1.2s; }
  #version { position:fixed; right:3vw; top:calc(env(safe-area-inset-top) + 1vh); font-size:10px; letter-spacing:.08em; color:rgba(255,255,240,.45); pointer-events:none; }
  #chargement { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#1c2412; letter-spacing:.3em; text-transform:uppercase; font-size:min(3.6vw,1.8vh); }
  .hide { display:none !important; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<video id="filmA" src="assets/monde.mp4" poster="assets/affiche.jpg" muted playsinline autoplay preload="auto"></video>
<video id="filmB" src="assets/monde.mp4" muted playsinline preload="auto"></video>
<div id="note">touche pour t'élancer</div>
<div id="version"></div>
<div id="chargement">la forêt s'éveille…</div>
<script type="module" src="test.js"></script>
</body>
</html>
