<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#041c1f">
<title>LIANE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#041c1f; overflow:hidden; }
  body { touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
         font-family:'Jost', system-ui, sans-serif; font-weight:300; color:#fff6dc; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .txt { position:fixed; left:0; right:0; text-align:center; letter-spacing:.22em; text-transform:uppercase; text-shadow:0 1px 10px rgba(2,24,28,.75);
         pointer-events:none; transition:opacity 1.4s; white-space:nowrap; }
  #note { bottom:calc(env(safe-area-inset-bottom) + 7vh); font-size:min(2.6vw, 3.6vh, 15px); }
  #tourne { top:calc(env(safe-area-inset-top) + 5vh); font-size:min(2.6vw, 12px); opacity:.75; }
  #version { position:fixed; right:calc(env(safe-area-inset-right) + 2vw); top:calc(env(safe-area-inset-top) + 1vh); font-size:10px; letter-spacing:.08em; color:rgba(255,246,220,.4); pointer-events:none; }
  #chargement { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#041c1f; letter-spacing:.3em; text-transform:uppercase; font-size:12px; transition:opacity .8s; pointer-events:none; }
  .vu { opacity:0 !important; }
</style>
</head>
<body>
<canvas id="ecran"></canvas>
<div id="tourne" class="txt">tourne ton téléphone pour voir plus loin</div>
<div id="note" class="txt">tiens pour t'accrocher · lâche pour t'élancer</div>
<div id="version"></div>
<div id="chargement">la forêt s'éveille…</div>
<script type="module" src="jouet.js?v=1"></script>
</body>
</html>
